version: '3.8'

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "8888:8888"
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_API_LLM_PROVIDER}
      - HINDSIGHT_API_LLM_API_KEY=${HINDSIGHT_API_LLM_API_KEY}
      - HINDSIGHT_API_LLM_GROQ_SERVICE_TIER=${HINDSIGHT_API_LLM_GROQ_SERVICE_TIER}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - HINDSIGHT_BASE_URL=http://hindsight:8888
      - HINDSIGHT_BANK_ID=${HINDSIGHT_BANK_ID:-incident-memory}
    depends_on:
      hindsight:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app
